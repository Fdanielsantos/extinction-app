spring:
  application:
    name: extinction-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/extinction?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:extinction}
    password: ${DB_PASSWORD:extinction}

  jpa:
    hibernate:
      # Fase de scaffold, sem schema estável ainda. Trocar por Flyway quando o domínio for modelado.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      # RF: múltiplas fotos por avistamento (até 6) — precisa caber a soma de
      # todos os arquivos numa única requisição, não só um arquivo por vez.
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  ml:
    # Caminho pra pasta gerada por ml/scripts/train_model.py (contém saved_model/ e
    # synset.txt). Default assume que o backend roda com cwd em backend/ (mvn
    # spring-boot:run, IDE) -- via Docker Compose isso é sobrescrito por MODEL_DIR
    # apontando pro bind mount de ../ml/model (ver backend/docker-compose.yml).
    model-dir: ${MODEL_DIR:../ml/model}
  identificacao:
    # Confiança mínima (%) pra uma predição do modelo virar candidata de espécie;
    # abaixo disso a resposta do RF018 vem vazia ("espécie não identificada"). O
    # modelo atual tem val_accuracy ~32% / val_top5_acc ~49% em ~11 mil classes
    # (ver ml/model/training_log.csv) -- com esse número de classes a
    # probabilidade do softmax fica bem diluída, então mesmo acertos ficam
    # tipicamente na faixa de 20-45% de confiança (ver exemplo real checado em
    # debug: classe correta em 2º lugar com 30.27%) -- 50% descartava quase
    # tudo, inclusive imagens do próprio conjunto de treino. Ajuste conforme o
    # treino evoluir.
    confianca-minima: ${CONFIANCA_MINIMA_IDENTIFICACAO:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
