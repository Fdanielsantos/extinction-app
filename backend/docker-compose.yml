services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: extinction
      MYSQL_USER: extinction
      MYSQL_PASSWORD: extinction
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bioclip:
    build: ../ml/bioclip_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Cache dos pesos do modelo e dos embeddings de texto da taxonomia embutida
      # (baixados do Hugging Face Hub via pybioclip, ver ml/bioclip_service/main.py)
      # -- evita rebaixar a cada restart.
      - bioclip_hf_cache:/root/.cache/huggingface

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      bioclip:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/extinction?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: extinction
      DB_PASSWORD: extinction
      BIOCLIP_URL: http://bioclip:8000
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
  bioclip_hf_cache:
